<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  :root{--bg:#fdf6ee;--text:#3b2a1a;--accent:#b83a2a;--accent-warm:#e8a87c;--border:#e8d5c0;--subtle:#8a6d54}
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:Georgia,serif;background:var(--bg);color:var(--text);line-height:1.9;max-width:960px;margin:0 auto;padding:1rem}

  h1{text-align:center;color:var(--accent);font-size:1.5rem;margin-bottom:.5rem;font-weight:normal}
  .sub{text-align:center;color:var(--subtle);font-size:.85rem;margin-bottom:1.5rem}

  .grid{display:grid;grid-template-columns:1fr 1fr;gap:1rem}
  .card{background:#fff;border:1px solid var(--border);border-radius:10px;overflow:hidden;text-align:center}
  .card-label{background:var(--accent);color:#fff;padding:.3rem;font-size:.75rem;letter-spacing:.1em}
  .card img{display:block;margin:1rem auto;width:150px;height:auto}
  .card .check{font-size:.78rem;color:var(--subtle);padding:0 1rem 1rem}
  .card .ok{color:#2a8a2a}
</style>
</head>
<body>

<h1>New Logo Candidates — 1024x1024, #FDF6EE Background</h1>
<p class="sub">All logos post-processed: background = exact #FDF6EE. Pick one.</p>

<div class="grid">
  <div class="card">
    <div class="card-label">V1</div>
    <img src="/images/brand/_new/v1-header.png" alt="Logo V1">
    <div class="check">1024×1024 · bg #FDF6EE <span class="ok">✓</span></div>
  </div>
  <div class="card">
    <div class="card-label">V2</div>
    <img src="/images/brand/_new/v2-header.png" alt="Logo V2">
    <div class="check">1024×1024 · bg #FDF6EE <span class="ok">✓</span></div>
  </div>
  <div class="card">
    <div class="card-label">V3</div>
    <img src="/images/brand/_new/v3-header.png" alt="Logo V3">
    <div class="check">1024×1024 · bg #FDF6EE <span class="ok">✓</span></div>
  </div>
  <div class="card">
    <div class="card-label">V4</div>
    <img src="/images/brand/_new/v4-header.png" alt="Logo V4">
    <div class="check">1024×1024 · bg #FDF6EE <span class="ok">✓</span></div>
  </div>
</div>

</body>
</html>
