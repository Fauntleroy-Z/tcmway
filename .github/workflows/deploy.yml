name: Auto-Update Archive & Counts

on:
  push:
    branches: [master]
    paths:
      - 'posts/**'
      - 'regenerate-archive.py'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Regenerate archive + counts
        run: python3 regenerate-archive.py

      - name: Commit auto-updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --staged --quiet || git commit -m "auto: regenerate archive + category counts [skip ci]"
          git push