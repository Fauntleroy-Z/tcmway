<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320">
  <defs>
    <style>
      .panel-border { fill:none; stroke:#e8d5c0; stroke-width:1.5; }
      .char { font-family: Georgia, "Times New Roman", serif; }
      .ollie-head { fill:#b83a2a; }
      .ollie-body { fill:#e8a87c; }
      .ollie-belly { fill:#f0c4a0; }
      .ollie-eye { fill:#ffffff; }
      .ollie-pupil { fill:#3b2a1a; }
      .ollie-beak { fill:#c9a84c; }
      .ollie-wing { fill:#d4956a; }
    </style>
    <!-- Soft glow filter for organs -->
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="320" fill="#fdf6ee" rx="12"/>

  <!-- ============ PANEL 1: The Character ============ -->
  <g transform="translate(10,10)">
    <rect width="285" height="300" class="panel-border" rx="8"/>

    <!-- Wooden desk surface -->
    <rect x="20" y="240" width="245" height="50" fill="#c4a882" rx="4" opacity="0.3"/>
    <line x1="20" y1="255" x2="265" y2="255" stroke="#b8996a" stroke-width="0.5" opacity="0.4"/>
    <line x1="20" y1="270" x2="265" y2="270" stroke="#b8996a" stroke-width="0.5" opacity="0.4"/>

    <!-- Large 藥 character -->
    <text x="95" y="120" font-size="52" fill="#b83a2a" class="char" text-anchor="middle" font-weight="bold">藥</text>

    <!-- Split decomposition -->
    <!-- Top part: 艹 -->
    <text x="200" y="65" font-size="24" fill="#4a8c5a" class="char" text-anchor="middle">艹</text>
    <text x="200" y="82" font-size="11" fill="#8a6d54" class="char" text-anchor="middle">herb</text>
    <line x1="170" y1="72" x2="148" y2="95" stroke="#c9a84c" stroke-width="1.5" stroke-linecap="round"/>

    <!-- Bottom part: 樂 -->
    <text x="200" y="185" font-size="24" fill="#b83a2a" class="char" text-anchor="middle">樂</text>
    <text x="200" y="202" font-size="11" fill="#8a6d54" class="char" text-anchor="middle">music</text>
    <line x1="170" y1="178" x2="148" y2="140" stroke="#c9a84c" stroke-width="1.5" stroke-linecap="round"/>

    <!-- Magnifying glass -->
    <circle cx="95" cy="118" r="42" fill="none" stroke="#5a4a3a" stroke-width="2.5"/>
    <circle cx="95" cy="118" r="45" fill="none" stroke="#c9a84c" stroke-width="1" stroke-dasharray="3,2" opacity="0.6"/>
    <line x1="130" y1="153" x2="152" y2="180" stroke="#5a4a3a" stroke-width="4" stroke-linecap="round"/>
    <line x1="152" y1="180" x2="165" y2="195" stroke="#8a6d54" stroke-width="5" stroke-linecap="round"/>

    <!-- === OLLIE (standing on desk, holding magnifier) === -->
    <!-- Shadow -->
    <ellipse cx="210" cy="265" rx="28" ry="8" fill="#d4c4a8" opacity="0.4"/>
    <!-- Body -->
    <ellipse cx="210" cy="235" rx="26" ry="22" class="ollie-body"/>
    <ellipse cx="210" cy="240" rx="18" ry="14" class="ollie-belly"/>
    <!-- Left wing -->
    <path d="M 188,225 Q 175,235 185,248" fill="none" stroke="#d4956a" stroke-width="3" stroke-linecap="round"/>
    <!-- Right wing (holding magnifier handle) -->
    <path d="M 232,225 Q 245,235 235,248" fill="none" stroke="#d4956a" stroke-width="3" stroke-linecap="round"/>
    <!-- Head -->
    <circle cx="210" cy="198" r="24" class="ollie-head"/>
    <!-- Ear tufts -->
    <ellipse cx="195" cy="178" rx="5" ry="10" class="ollie-head" transform="rotate(-20 195 178)"/>
    <ellipse cx="225" cy="178" rx="5" ry="10" class="ollie-head" transform="rotate(20 225 178)"/>
    <!-- Eyes (large and round like in PNG) -->
    <ellipse cx="202" cy="196" rx="7" ry="9" class="ollie-eye"/>
    <ellipse cx="218" cy="196" rx="7" ry="9" class="ollie-eye"/>
    <circle cx="204" cy="198" r="4.5" class="ollie-pupil"/>
    <circle cx="216" cy="198" r="4.5" class="ollie-pupil"/>
    <circle cx="205" cy="196" r="1.5" fill="white"/>
    <circle cx="217" cy="196" r="1.5" fill="white"/>
    <!-- Beak -->
    <polygon points="210,208 206,203 214,203" class="ollie-beak"/>
    <!-- Feet -->
    <polygon points="200,255 196,265 204,265" fill="#c9a84c"/>
    <polygon points="220,255 216,265 224,265" fill="#c9a84c"/>
    <!-- Yin-yang pendant -->
    <circle cx="210" cy="225" r="5" fill="#c9a84c" stroke="#5a4a3a" stroke-width="0.8"/>
    <path d="M 210,220 A 2.5,2.5 0 0,1 210,225 A 2.5,2.5 0 0,0 210,230 A 5,5 0 0,1 210,220" fill="#3b2a1a"/>

    <text x="142" y="298" font-size="11" fill="#8a6d54" class="char" text-anchor="middle">Panel 1 · 藥 = 艹 + 樂</text>
  </g>

  <!-- ============ PANEL 2: Five Tones, Five Organs ============ -->
  <g transform="translate(305,10)">
    <rect width="285" height="300" class="panel-border" rx="8"/>

    <!-- Background gradient feel -->
    <rect x="15" y="15" width="255" height="270" fill="#faf3e8" rx="6" opacity="0.5"/>

    <!-- Guqin (more detailed) -->
    <rect x="55" y="235" width="170" height="14" fill="#8a6d54" rx="3"/>
    <rect x="65" y="232" width="150" height="4" fill="#6b4f3a" rx="1"/>
    <!-- Strings -->
    <line x1="75" y1="215" x2="75" y2="235" stroke="#3b2a1a" stroke-width="0.8"/>
    <line x1="95" y1="210" x2="95" y2="235" stroke="#3b2a1a" stroke-width="0.8"/>
    <line x1="115" y1="208" x2="115" y2="235" stroke="#3b2a1a" stroke-width="0.8"/>
    <line x1="135" y1="208" x2="135" y2="235" stroke="#3b2a1a" stroke-width="0.8"/>
    <line x1="155" y1="210" x2="155" y2="235" stroke="#3b2a1a" stroke-width="0.8"/>
    <line x1="175" y1="215" x2="175" y2="235" stroke="#3b2a1a" stroke-width="0.8"/>
    <line x1="195" y1="220" x2="195" y2="235" stroke="#3b2a1a" stroke-width="0.8"/>

    <!-- === OLLIE (playing guqin) === -->
    <ellipse cx="140" cy="255" rx="5" ry="3" fill="#d4c4a8" opacity="0.4"/>
    <ellipse cx="140" cy="225" rx="26" ry="22" class="ollie-body"/>
    <ellipse cx="140" cy="230" rx="18" ry="14" class="ollie-belly"/>
    <path d="M 118,215 Q 105,225 115,238" fill="none" stroke="#d4956a" stroke-width="3" stroke-linecap="round"/>
    <path d="M 162,215 Q 175,225 165,238" fill="none" stroke="#d4956a" stroke-width="3" stroke-linecap="round"/>
    <circle cx="140" cy="188" r="24" class="ollie-head"/>
    <ellipse cx="125" cy="168" rx="5" ry="10" class="ollie-head" transform="rotate(-20 125 168)"/>
    <ellipse cx="155" cy="168" rx="5" ry="10" class="ollie-head" transform="rotate(20 155 168)"/>
    <ellipse cx="132" cy="186" rx="7" ry="9" class="ollie-eye"/>
    <ellipse cx="148" cy="186" rx="7" ry="9" class="ollie-eye"/>
    <circle cx="134" cy="188" r="4.5" class="ollie-pupil"/>
    <circle cx="146" cy="188" r="4.5" class="ollie-pupil"/>
    <circle cx="135" cy="186" r="1.5" fill="white"/>
    <circle cx="147" cy="186" r="1.5" fill="white"/>
    <polygon points="140,198 136,193 144,193" class="ollie-beak"/>
    <polygon points="130,245 126,255 134,255" fill="#c9a84c"/>
    <polygon points="150,245 146,255 154,255" fill="#c9a84c"/>
    <circle cx="140" cy="215" r="5" fill="#c9a84c" stroke="#5a4a3a" stroke-width="0.8"/>
    <path d="M 140,210 A 2.5,2.5 0 0,1 140,215 A 2.5,2.5 0 0,0 140,220 A 5,5 0 0,1 140,210" fill="#3b2a1a"/>

    <!-- Musical notes floating -->
    <text x="70" y="160" font-size="22" fill="#b83a2a" class="char">♪</text>
    <text x="100" y="135" font-size="26" fill="#c9a84c" class="char">♫</text>
    <text x="145" y="125" font-size="20" fill="#4a8c5a" class="char">♪</text>
    <text x="185" y="140" font-size="24" fill="#4a7ab8" class="char">♬</text>
    <text x="210" y="165" font-size="18" fill="#b83a2a" class="char">♩</text>

    <!-- Sound waves -->
    <path d="M 165,180 Q 180,160 195,170" fill="none" stroke="#c9a84c" stroke-width="1" opacity="0.4"/>
    <path d="M 170,185 Q 185,165 200,175" fill="none" stroke="#c9a84c" stroke-width="1" opacity="0.3"/>

    <!-- Five organ circles (right side, with glow) -->
    <!-- Heart -->
    <circle cx="250" cy="55" r="14" fill="#b83a2a" opacity="0.15" filter="url(#glow)"/>
    <circle cx="250" cy="55" r="12" fill="none" stroke="#b83a2a" stroke-width="1.5" opacity="0.5"/>
    <text x="250" y="60" font-size="10" fill="#b83a2a" class="char" text-anchor="middle" font-weight="bold">♥ Heart</text>

    <!-- Liver -->
    <circle cx="250" cy="100" r="14" fill="#4a8c5a" opacity="0.15" filter="url(#glow)"/>
    <circle cx="250" cy="100" r="12" fill="none" stroke="#4a8c5a" stroke-width="1.5" opacity="0.5"/>
    <text x="250" y="104" font-size="9" fill="#4a8c5a" class="char" text-anchor="middle">Liver 肝</text>

    <!-- Spleen -->
    <circle cx="250" cy="145" r="14" fill="#c9a84c" opacity="0.15" filter="url(#glow)"/>
    <circle cx="250" cy="145" r="12" fill="none" stroke="#c9a84c" stroke-width="1.5" opacity="0.5"/>
    <text x="250" y="149" font-size="9" fill="#c9a84c" class="char" text-anchor="middle">Spleen 脾</text>

    <!-- Lungs -->
    <circle cx="250" cy="190" r="14" fill="#8a8a8a" opacity="0.12" filter="url(#glow)"/>
    <circle cx="250" cy="190" r="12" fill="none" stroke="#8a8a8a" stroke-width="1.5" opacity="0.4"/>
    <text x="250" y="194" font-size="9" fill="#8a8a8a" class="char" text-anchor="middle">Lungs 肺</text>

    <!-- Kidneys -->
    <circle cx="250" cy="235" r="14" fill="#4a7ab8" opacity="0.15" filter="url(#glow)"/>
    <circle cx="250" cy="235" r="12" fill="none" stroke="#4a7ab8" stroke-width="1.5" opacity="0.5"/>
    <text x="250" y="239" font-size="9" fill="#4a7ab8" class="char" text-anchor="middle">Kidneys 腎</text>

    <!-- Connecting dashed lines -->
    <line x1="165" y1="170" x2="238" y2="65" stroke="#c9a84c" stroke-width="0.8" stroke-dasharray="3,3" opacity="0.35"/>
    <line x1="170" y1="175" x2="238" y2="110" stroke="#c9a84c" stroke-width="0.8" stroke-dasharray="3,3" opacity="0.3"/>
    <line x1="175" y1="180" x2="238" y2="155" stroke="#c9a84c" stroke-width="0.8" stroke-dasharray="3,3" opacity="0.25"/>

    <text x="142" y="298" font-size="11" fill="#8a6d54" class="char" text-anchor="middle">Panel 2 · 五音 → 五脏</text>
  </g>

  <!-- ============ PANEL 3: Modern Healing ============ -->
  <g transform="translate(600,10)">
    <rect width="285" height="300" class="panel-border" rx="8"/>
    <rect x="15" y="15" width="255" height="270" fill="#faf3e8" rx="6" opacity="0.5"/>

    <!-- Person sitting in chair, listening to music -->
    <!-- Chair back -->
    <rect x="95" y="160" width="70" height="80" fill="#b8996a" rx="8" opacity="0.3"/>
    <rect x="100" y="165" width="60" height="70" fill="#d4c4a8" rx="6" opacity="0.4"/>
    <!-- Person body -->
    <rect x="110" y="185" width="48" height="55" fill="#e8c4a0" rx="10"/>
    <!-- Head -->
    <circle cx="134" cy="165" r="22" fill="#f0d4b0"/>
    <!-- Relaxed closed eyes -->
    <path d="M 124,166 Q 128,162 132,166" fill="none" stroke="#8a6d54" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M 136,166 Q 140,162 144,166" fill="none" stroke="#8a6d54" stroke-width="1.5" stroke-linecap="round"/>
    <!-- Smile -->
    <path d="M 128,175 Q 134,180 140,175" fill="none" stroke="#8a6d54" stroke-width="1.2" stroke-linecap="round"/>

    <!-- Headphones -->
    <ellipse cx="112" cy="165" rx="6" ry="10" fill="none" stroke="#5a4a3a" stroke-width="4"/>
    <ellipse cx="156" cy="165" rx="6" ry="10" fill="none" stroke="#5a4a3a" stroke-width="4"/>
    <path d="M 112,155 Q 134,135 156,155" fill="none" stroke="#5a4a3a" stroke-width="3" stroke-linecap="round"/>

    <!-- Music notes from headphones -->
    <text x="75" y="130" font-size="18" fill="#b83a2a" class="char">♪</text>
    <text x="165" y="125" font-size="20" fill="#4a7ab8" class="char">♫</text>
    <text x="100" y="105" font-size="16" fill="#4a8c5a" class="char">♪</text>
    <text x="140" y="95" font-size="14" fill="#c9a84c" class="char">♩</text>

    <!-- Glowing organ icons around person -->
    <circle cx="75" cy="195" r="10" fill="#b83a2a" opacity="0.12" filter="url(#glow)"/>
    <text x="75" y="199" font-size="8" fill="#b83a2a" class="char" text-anchor="middle">♥</text>

    <circle cx="195" cy="185" r="10" fill="#4a8c5a" opacity="0.12" filter="url(#glow)"/>
    <text x="195" y="189" font-size="7" fill="#4a8c5a" class="char" text-anchor="middle">肝</text>

    <circle cx="200" cy="225" r="10" fill="#c9a84c" opacity="0.12" filter="url(#glow)"/>
    <text x="200" y="229" font-size="7" fill="#c9a84c" class="char" text-anchor="middle">脾</text>

    <circle cx="70" cy="235" r="10" fill="#4a7ab8" opacity="0.12" filter="url(#glow)"/>
    <text x="70" y="239" font-size="7" fill="#4a7ab8" class="char" text-anchor="middle">腎</text>

    <!-- === OLLIE (small, observing from side) === -->
    <ellipse cx="230" cy="275" rx="4" ry="2" fill="#d4c4a8" opacity="0.4"/>
    <ellipse cx="230" cy="258" rx="16" ry="13" class="ollie-body"/>
    <ellipse cx="230" cy="261" rx="11" ry="8" class="ollie-belly"/>
    <circle cx="230" cy="242" r="14" class="ollie-head"/>
    <ellipse cx="220" cy="230" rx="3" ry="6" class="ollie-head" transform="rotate(-20 220 230)"/>
    <ellipse cx="240" cy="230" rx="3" ry="6" class="ollie-head" transform="rotate(20 240 230)"/>
    <ellipse cx="225" cy="241" rx="4" ry="5" class="ollie-eye"/>
    <ellipse cx="235" cy="241" rx="4" ry="5" class="ollie-eye"/>
    <circle cx="226" cy="242" r="2.5" class="ollie-pupil"/>
    <circle cx="234" cy="242" r="2.5" class="ollie-pupil"/>
    <circle cx="227" cy="241" r="1" fill="white"/>
    <circle cx="235" cy="241" r="1" fill="white"/>
    <polygon points="230,248 227,245 233,245" class="ollie-beak"/>
    <circle cx="230" cy="254" r="3" fill="#c9a84c" stroke="#5a4a3a" stroke-width="0.5"/>
    <!-- Tiny wing pointing -->
    <path d="M 242,252 Q 250,248 248,258" fill="none" stroke="#d4956a" stroke-width="2" stroke-linecap="round"/>

    <!-- Speech bubble -->
    <rect x="175" y="35" width="95" height="38" fill="white" stroke="#b83a2a" stroke-width="1" rx="10"/>
    <polygon points="215,73 225,82 235,73" fill="white" stroke="#b83a2a" stroke-width="1"/>
    <polygon points="216,73 234,73" fill="white"/>
    <text x="222" y="52" font-size="9" fill="#3b2a1a" class="char" text-anchor="middle">Still works</text>
    <text x="222" y="65" font-size="9" fill="#3b2a1a" class="char" text-anchor="middle">today! 🎧</text>

    <text x="142" y="298" font-size="11" fill="#8a6d54" class="char" text-anchor="middle">Panel 3 · Music heals today too</text>
  </g>

  <!-- ============ PANEL 4: Ollie's Wisdom ============ -->
  <g transform="translate(895,10)">
    <rect width="285" height="300" class="panel-border" rx="8"/>
    <rect x="15" y="15" width="255" height="270" fill="#faf3e8" rx="6" opacity="0.5"/>

    <!-- Large speech bubble -->
    <rect x="45" y="45" width="200" height="70" fill="white" stroke="#b83a2a" stroke-width="1.2" rx="14"/>
    <polygon points="135,115 148,130 160,115" fill="white" stroke="#b83a2a" stroke-width="1.2"/>
    <polygon points="136,115 159,115" fill="white"/>
    <text x="145" y="68" font-size="11" fill="#3b2a1a" class="char" text-anchor="middle">"The ancients didn't have</text>
    <text x="145" y="84" font-size="11" fill="#3b2a1a" class="char" text-anchor="middle">CT scans or blood tests...</text>
    <text x="145" y="100" font-size="11" fill="#b83a2a" class="char" text-anchor="middle" font-weight="bold">They had ears."</text>

    <!-- === OLLIE (winking, wise pose) === -->
    <ellipse cx="148" cy="280" rx="32" ry="10" fill="#d4c4a8" opacity="0.4"/>
    <!-- Body -->
    <ellipse cx="148" cy="240" rx="30" ry="26" class="ollie-body"/>
    <ellipse cx="148" cy="246" rx="22" ry="17" class="ollie-belly"/>
    <!-- Wings -->
    <path d="M 122,228 Q 105,240 118,255" fill="none" stroke="#d4956a" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M 174,228 Q 191,240 178,255" fill="none" stroke="#d4956a" stroke-width="3.5" stroke-linecap="round"/>
    <!-- Head -->
    <circle cx="148" cy="200" r="28" class="ollie-head"/>
    <!-- Ear tufts -->
    <ellipse cx="130" cy="178" rx="6" ry="12" class="ollie-head" transform="rotate(-20 130 178)"/>
    <ellipse cx="166" cy="178" rx="6" ry="12" class="ollie-head" transform="rotate(20 166 178)"/>
    <!-- Eyes: left open, right winking -->
    <ellipse cx="138" cy="198" rx="8" ry="10" class="ollie-eye"/>
    <circle cx="140" cy="200" r="5" class="ollie-pupil"/>
    <circle cx="141" cy="198" r="2" fill="white"/>
    <!-- Winking eye (right) -->
    <path d="M 158,198 Q 164,192 170,198" fill="none" stroke="#3b2a1a" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Beak -->
    <polygon points="148,212 143,206 153,206" class="ollie-beak"/>
    <!-- Feet -->
    <polygon points="135,263 130,275 140,275" fill="#c9a84c"/>
    <polygon points="161,263 156,275 166,275" fill="#c9a84c"/>
    <!-- Pendant -->
    <circle cx="148" cy="230" r="6" fill="#c9a84c" stroke="#5a4a3a" stroke-width="1"/>
    <path d="M 148,224 A 3,3 0 0,1 148,230 A 3,3 0 0,0 148,236 A 6,6 0 0,1 148,224" fill="#3b2a1a"/>

    <!-- Large 藥 character at bottom -->
    <text x="148" y="275" font-size="42" fill="#b83a2a" class="char" text-anchor="middle" opacity="0.75" font-weight="bold">藥</text>
    <text x="148" y="294" font-size="10" fill="#c9a84c" class="char" text-anchor="middle" opacity="0.8">...they had ears</text>

    <text x="142" y="298" font-size="11" fill="#8a6d54" class="char" text-anchor="middle">Panel 4 · They had ears</text>
  </g>

  <!-- Panel separator lines -->
  <line x1="300" y1="10" x2="300" y2="310" stroke="#e8d5c0" stroke-width="1"/>
  <line x1="595" y1="10" x2="595" y2="310" stroke="#e8d5c0" stroke-width="1"/>
  <line x1="890" y1="10" x2="890" y2="310" stroke="#e8d5c0" stroke-width="1"/>

  <!-- Bottom caption -->
  <text x="600" y="318" font-size="11" fill="#8a6d54" class="char" text-anchor="middle" opacity="0.6">Article #13 Comic · Ollie the Owl · TCM Way</text>
</svg>
