<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 580" width="680" height="580">
  <!-- TCM Way #16: Yin & Yang Seesaw — 4-Panel Warm Comic (Direction B) -->
  <!-- Style: warm handmade — soft gradients, gentle shadows, organic curves -->
  <!-- Ollie palette: #b83a2a (zhu red), #e8a87c (apricot), #fdf6ee (warm white), #c9a84c (gold), #8a6e54 (subtle brown) -->

  <defs>
    <!-- Ollie body gradient (warm, from lighter center to apricot edge) -->
    <radialGradient id="ollieBody" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#f0c8a0"/>
      <stop offset="70%" stop-color="#e8a87c"/>
      <stop offset="100%" stop-color="#d49264"/>
    </radialGradient>
    <!-- Ollie eye gradient (zhu red, slight depth) -->
    <radialGradient id="ollieEye" cx="50%" cy="35%" r="55%">
      <stop offset="0%" stop-color="#d4534a"/>
      <stop offset="100%" stop-color="#b83a2a"/>
    </radialGradient>
    <!-- Soft shadow filter -->
    <filter id="softShadow" x="-15%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="1.5" dy="3" stdDeviation="2.5" flood-color="#00000018"/>
    </filter>
    <!-- Warm glow filter -->
    <filter id="warmGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <!-- Panel background gradient -->
    <linearGradient id="panelBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fffaf5"/>
      <stop offset="100%" stop-color="#fdf6ee"/>
    </linearGradient>

    <style>
      .panel-rect { fill: url(#panelBg); stroke: #e8d5c0; stroke-width: 1.5; rx: 6; }
      .label { font-family: Georgia, serif; font-size: 11px; fill: #8a6e54; }
      .caption { font-family: Georgia, serif; font-size: 13px; fill: #b83a2a; text-anchor: middle; font-style: italic; }
      .bubble-bg { fill: #fffef9; stroke: #e8d5c0; stroke-width: 1.5; rx: 10; }
      .bubble-text { font-family: Georgia, serif; font-size: 11px; fill: #3b2a1a; }
      .ground-line { stroke: #e8d5c0; stroke-width: 2; stroke-linecap: round; }
    </style>
  </defs>

  <!-- ===== PANEL 1: Balanced Seesaw (Top-Left) ===== -->
  <g transform="translate(4,4)">
    <rect width="334" height="284" class="panel-rect"/>
    <text x="16" y="20" class="label">1</text>
    <!-- Ground -->
    <line x1="40" y1="225" x2="300" y2="225" class="ground-line"/>
    <!-- Fulcrum (warm wood tone) -->
    <polygon points="170,225 152,182 188,182" fill="#c4a882" stroke="#8a6e54" stroke-width="1.5" stroke-linejoin="round"/>
    <!-- Seesaw plank -->
    <line x1="78" y1="182" x2="262" y2="182" stroke="#6b4c30" stroke-width="3" stroke-linecap="round"/>
    <!-- Yin seat (left) -->
    <ellipse cx="85" cy="179" rx="12" ry="5" fill="#e8d5c0" stroke="#8a6e54" stroke-width="1"/>
    <text x="85" y="170" font-family="Georgia" font-size="8" fill="#8a6e54" text-anchor="middle">YIN</text>
    <!-- Yang seat (right) -->
    <ellipse cx="255" cy="179" rx="12" ry="5" fill="#f0d894" stroke="#8a6e54" stroke-width="1"/>
    <text x="255" y="170" font-family="Georgia" font-size="8" fill="#8a6e54" text-anchor="middle">YANG</text>
    <!-- Moon icon -->
    <circle cx="85" cy="162" r="5" fill="#fdf6ee" stroke="#8a6e54" stroke-width="1.2"/>
    <!-- Sun icon -->
    <circle cx="255" cy="162" r="5.5" fill="#f0d894" stroke="#c9a84c" stroke-width="1.2"/>
    <!-- Ollie (beside seesaw, pointing) -->
    <g transform="translate(295,195)" filter="url(#softShadow)">
      <ellipse cx="0" cy="0" rx="16" ry="14" fill="url(#ollieBody)"/>
      <ellipse cx="0" cy="-2" rx="10" ry="9" fill="#fdf6ee"/>
      <!-- Eyes -->
      <ellipse cx="-4" cy="-3" rx="4" ry="5" fill="white"/>
      <ellipse cx="4" cy="-3" rx="4" ry="5" fill="white"/>
      <ellipse cx="-4" cy="-2" rx="3" ry="3.5" fill="url(#ollieEye)"/>
      <ellipse cx="4" cy="-2" rx="3" ry="3.5" fill="url(#ollieEye)"/>
      <circle cx="-4" cy="-1.5" r="1.6" fill="#1a1410"/>
      <circle cx="4" cy="-1.5" r="1.6" fill="#1a1410"/>
      <circle cx="-5" cy="-4" r="1" fill="white" opacity="0.9"/>
      <circle cx="3" cy="-4" r="1" fill="white" opacity="0.9"/>
      <!-- Beak -->
      <polygon points="0,4 -3,7 3,7" fill="#b83a2a"/>
      <!-- Ear tufts (organic curves) -->
      <path d="M-8,-7 Q-10,-16 -5,-15 Q-3,-18 0,-8" fill="#b83a2a" stroke="#8a6e54" stroke-width="0.8"/>
      <path d="M8,-7 Q10,-16 5,-15 Q3,-18 0,-8" fill="#b83a2a" stroke="#8a6e54" stroke-width="0.8"/>
      <!-- Pendant -->
      <circle cx="0" cy="10" r="3" fill="#c9a84c" opacity="0.8" stroke="#b83a2a" stroke-width="0.8"/>
    </g>
    <!-- Speech bubble -->
    <rect x="130" y="90" width="185" height="38" class="bubble-bg"/>
    <polygon points="210,128 205,118 215,118" fill="#fffef9" stroke="#e8d5c0" stroke-width="1.5"/>
    <text x="222" y="110" class="bubble-text">Meet the oldest seesaw</text>
    <text x="222" y="123" class="bubble-text">in medical history.</text>
  </g>

  <!-- ===== PANEL 2: Yang Rises (Top-Right) ===== -->
  <g transform="translate(342,4)">
    <rect width="334" height="284" class="panel-rect"/>
    <text x="16" y="20" class="label">2</text>
    <!-- Warm golden ambient glow -->
    <ellipse cx="280" cy="130" rx="100" ry="80" fill="#f0d894" opacity="0.12"/>
    <!-- Ground -->
    <line x1="40" y1="225" x2="300" y2="225" class="ground-line"/>
    <!-- Fulcrum -->
    <polygon points="170,225 152,182 188,182" fill="#c4a882" stroke="#8a6e54" stroke-width="1.5" stroke-linejoin="round"/>
    <!-- Seesaw (Yang DOWN, Yin UP) -->
    <line x1="82" y1="170" x2="258" y2="197" stroke="#6b4c30" stroke-width="3" stroke-linecap="round"/>
    <!-- Yin seat (UP) -->
    <ellipse cx="88" cy="168" rx="12" ry="5" fill="#e8d5c0" stroke="#8a6e54" stroke-width="1" transform="rotate(-10,88,168)"/>
    <text x="88" y="158" font-family="Georgia" font-size="8" fill="#b83a2a" text-anchor="middle">YIN ↑</text>
    <!-- Yang seat (DOWN) with warm glow -->
    <ellipse cx="252" cy="199" rx="14" ry="6" fill="#f0d894" stroke="#c9a84c" stroke-width="1.2" filter="url(#warmGlow)"/>
    <text x="252" y="214" font-family="Georgia" font-size="8" fill="#b83a2a" text-anchor="middle">YANG ↓</text>
    <!-- Sun glow -->
    <circle cx="260" cy="160" r="20" fill="#f0d894" opacity="0.25"/>
    <!-- Ollie on Yang side (looking up) -->
    <g transform="translate(255,190)" filter="url(#softShadow)">
      <ellipse cx="0" cy="0" rx="15" ry="13" fill="url(#ollieBody)"/>
      <ellipse cx="0" cy="-1" rx="9.5" ry="8.5" fill="#fdf6ee"/>
      <ellipse cx="-3.5" cy="-3" rx="4" ry="5" fill="white"/>
      <ellipse cx="3.5" cy="-3" rx="4" ry="5" fill="white"/>
      <ellipse cx="-3.5" cy="-2.5" rx="3" ry="3.5" fill="url(#ollieEye)"/>
      <ellipse cx="3.5" cy="-2.5" rx="3" ry="3.5" fill="url(#ollieEye)"/>
      <circle cx="-3.5" cy="-2" r="1.5" fill="#1a1410"/>
      <circle cx="3.5" cy="-2" r="1.5" fill="#1a1410"/>
      <circle cx="-4.5" cy="-4" r="1" fill="white" opacity="0.9"/>
      <circle cx="2.5" cy="-4" r="1" fill="white" opacity="0.9"/>
      <polygon points="0,3.5 -2.5,6.5 2.5,6.5" fill="#b83a2a"/>
      <path d="M-7.5,-6.5 Q-9.5,-15 -4.5,-14 Q-2.5,-17 0,-7.5" fill="#b83a2a" stroke="#8a6e54" stroke-width="0.8"/>
      <path d="M7.5,-6.5 Q9.5,-15 4.5,-14 Q2.5,-17 0,-7.5" fill="#b83a2a" stroke="#8a6e54" stroke-width="0.8"/>
      <circle cx="0" cy="9.5" r="2.8" fill="#c9a84c" opacity="0.8" stroke="#b83a2a" stroke-width="0.8"/>
    </g>
    <text x="170" y="275" class="caption">Yang rises, Yin falls.</text>
  </g>

  <!-- ===== PANEL 3: Yin Rises (Bottom-Left) ===== -->
  <g transform="translate(4,292)">
    <rect width="334" height="284" class="panel-rect"/>
    <text x="16" y="20" class="label">3</text>
    <!-- Cool subtle ambient -->
    <ellipse cx="75" cy="130" rx="90" ry="80" fill="#b8c8d8" opacity="0.08"/>
    <line x1="40" y1="225" x2="300" y2="225" class="ground-line"/>
    <polygon points="170,225 152,182 188,182" fill="#c4a882" stroke="#8a6e54" stroke-width="1.5" stroke-linejoin="round"/>
    <!-- Seesaw (Yin DOWN, Yang UP) -->
    <line x1="82" y1="197" x2="258" y2="170" stroke="#6b4c30" stroke-width="3" stroke-linecap="round"/>
    <!-- Yin seat (DOWN) -->
    <ellipse cx="88" cy="199" rx="14" ry="6" fill="#e8d5c0" stroke="#8a6e54" stroke-width="1.2"/>
    <text x="88" y="214" font-family="Georgia" font-size="8" fill="#b83a2a" text-anchor="middle">YIN ↓</text>
    <!-- Moon icon -->
    <circle cx="82" cy="170" r="6" fill="#fdf6ee" stroke="#8a6e54" stroke-width="1.2" opacity="0.7"/>
    <!-- Yang seat (UP) -->
    <ellipse cx="252" cy="168" rx="12" ry="5" fill="#f0d894" stroke="#8a6e54" stroke-width="1" transform="rotate(10,252,168)"/>
    <text x="252" y="158" font-family="Georgia" font-size="8" fill="#b83a2a" text-anchor="middle">YANG ↑</text>
    <!-- Ollie on Yin side (calm, steady) -->
    <g transform="translate(88,190)" filter="url(#softShadow)">
      <ellipse cx="0" cy="0" rx="15" ry="13" fill="url(#ollieBody)"/>
      <ellipse cx="0" cy="-1" rx="9.5" ry="8.5" fill="#fdf6ee"/>
      <ellipse cx="-3.5" cy="-3" rx="4" ry="5" fill="white"/>
      <ellipse cx="3.5" cy="-3" rx="4" ry="5" fill="white"/>
      <ellipse cx="-3.5" cy="-2.5" rx="3" ry="3.5" fill="url(#ollieEye)"/>
      <ellipse cx="3.5" cy="-2.5" rx="3" ry="3.5" fill="url(#ollieEye)"/>
      <circle cx="-3.5" cy="-2" r="1.5" fill="#1a1410"/>
      <circle cx="3.5" cy="-2" r="1.5" fill="#1a1410"/>
      <circle cx="-4.5" cy="-4" r="1" fill="white" opacity="0.9"/>
      <circle cx="2.5" cy="-4" r="1" fill="white" opacity="0.9"/>
      <polygon points="0,3.5 -2.5,6.5 2.5,6.5" fill="#b83a2a"/>
      <path d="M-7.5,-6.5 Q-9.5,-15 -4.5,-14 Q-2.5,-17 0,-7.5" fill="#b83a2a" stroke="#8a6e54" stroke-width="0.8"/>
      <path d="M7.5,-6.5 Q9.5,-15 4.5,-14 Q2.5,-17 0,-7.5" fill="#b83a2a" stroke="#8a6e54" stroke-width="0.8"/>
      <circle cx="0" cy="9.5" r="2.8" fill="#c9a84c" opacity="0.8" stroke="#b83a2a" stroke-width="0.8"/>
      <!-- Blush -->
      <ellipse cx="-6" cy="2" rx="3" ry="2" fill="#e8a87c" opacity="0.3"/>
      <ellipse cx="6" cy="2" rx="3" ry="2" fill="#e8a87c" opacity="0.3"/>
    </g>
    <text x="170" y="275" class="caption">Yin rises, Yang falls.</text>
  </g>

  <!-- ===== PANEL 4: Dynamic Balance (Bottom-Right) ===== -->
  <g transform="translate(342,292)">
    <rect width="334" height="284" class="panel-rect"/>
    <text x="16" y="20" class="label">4</text>
    <!-- Dusk transition gradient band -->
    <rect x="40" y="130" width="260" height="30" fill="#e8a87c" opacity="0.08"/>
    <line x1="40" y1="225" x2="300" y2="225" class="ground-line"/>
    <polygon points="170,225 152,182 188,182" fill="#c4a882" stroke="#8a6e54" stroke-width="1.5" stroke-linejoin="round"/>
    <!-- Seesaw in gentle dynamic motion — slightly tilted -->
    <line x1="90" y1="190" x2="250" y2="185" stroke="#6b4c30" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Motion rhythm lines -->
    <path d="M55,180 Q80,170 105,180 Q130,190 155,180" fill="none" stroke="#e8d5c0" stroke-width="1.8" stroke-linecap="round"/>
    <path d="M185,180 Q205,172 230,180 Q250,188 275,178" fill="none" stroke="#f0d894" stroke-width="1.8" stroke-linecap="round" opacity="0.6"/>
    <!-- Subtle Yin seat -->
    <ellipse cx="95" cy="189" rx="10" ry="4" fill="#e8d5c0" stroke="#8a6e54" stroke-width="0.8" opacity="0.6"/>
    <text x="95" y="180" font-family="Georgia" font-size="8" fill="#8a6e54" text-anchor="middle">YIN</text>
    <!-- Subtle Yang seat -->
    <ellipse cx="245" cy="184" rx="10" ry="4" fill="#f0d894" stroke="#c9a84c" stroke-width="0.8" opacity="0.6"/>
    <text x="245" y="175" font-family="Georgia" font-size="8" fill="#8a6e54" text-anchor="middle">YANG</text>
    <!-- Ollie (beside seesaw, pointing warmly) -->
    <g transform="translate(290,195)" filter="url(#softShadow)">
      <ellipse cx="0" cy="0" rx="16" ry="14" fill="url(#ollieBody)"/>
      <ellipse cx="0" cy="-2" rx="10" ry="9" fill="#fdf6ee"/>
      <ellipse cx="-4" cy="-3" rx="4" ry="5" fill="white"/>
      <ellipse cx="4" cy="-3" rx="4" ry="5" fill="white"/>
      <ellipse cx="-4" cy="-2" rx="3" ry="3.5" fill="url(#ollieEye)"/>
      <ellipse cx="4" cy="-2" rx="3" ry="3.5" fill="url(#ollieEye)"/>
      <circle cx="-4" cy="-1.5" r="1.6" fill="#1a1410"/>
      <circle cx="4" cy="-1.5" r="1.6" fill="#1a1410"/>
      <circle cx="-5" cy="-4" r="1" fill="white" opacity="0.9"/>
      <circle cx="3" cy="-4" r="1" fill="white" opacity="0.9"/>
      <polygon points="0,4 -3,7 3,7" fill="#b83a2a"/>
      <path d="M-8,-7 Q-10,-16 -5,-15 Q-3,-18 0,-8" fill="#b83a2a" stroke="#8a6e54" stroke-width="0.8"/>
      <path d="M8,-7 Q10,-16 5,-15 Q3,-18 0,-8" fill="#b83a2a" stroke="#8a6e54" stroke-width="0.8"/>
      <circle cx="0" cy="10" r="3" fill="#c9a84c" opacity="0.8" stroke="#b83a2a" stroke-width="0.8"/>
      <!-- Warm knowing blush -->
      <ellipse cx="-6" cy="1" rx="3" ry="2" fill="#e8a87c" opacity="0.3"/>
      <ellipse cx="6" cy="1" rx="3" ry="2" fill="#e8a87c" opacity="0.3"/>
    </g>
    <!-- Pointing wing -->
    <line x1="278" y1="193" x2="250" y2="188" stroke="#b83a2a" stroke-width="1.8" stroke-linecap="round"/>
    <!-- Speech bubble -->
    <rect x="30" y="245" width="260" height="38" class="bubble-bg"/>
    <polygon points="135,283 130,275 140,275" fill="#fffef9" stroke="#e8d5c0" stroke-width="1.5"/>
    <text x="160" y="262" class="bubble-text">Neither side is winning.</text>
    <text x="160" y="275" class="bubble-text">That is the point.</text>
  </g>
</svg>
