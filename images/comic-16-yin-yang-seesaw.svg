<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 580" width="680" height="580">
  <!-- TCM Way #16: Yin & Yang Seesaw — 4-Panel Comic -->
  <!-- Ollie design: consistent with comic-13 — golden beak (#c9a84c), ellipse ear tufts, body+belly layers -->
  <defs>
    <style>
      .bg { fill: #fdf6ee; stroke: none; }
      .outline { fill: none; stroke: #3b2a1a; stroke-width: 1.8; stroke-linejoin: round; }
      .thin { fill: none; stroke: #3b2a1a; stroke-width: 0.8; }
      .label { font-family: Georgia, serif; font-size: 12px; fill: #3b2a1a; text-anchor: middle; }
      .bubble { fill: white; stroke: #3b2a1a; stroke-width: 1.5; }
      .bubble-text { font-family: Georgia, serif; font-size: 11px; fill: #3b2a1a; }
      .caption { font-family: Georgia, serif; font-size: 14px; fill: #b83a2a; text-anchor: middle; font-style: italic; }
      .panel-label { font-family: Georgia, serif; font-size: 10px; fill: #8a6e54; }
      /* Ollie canonical style (matching comic-13) */
      .ollie-head { fill: #b83a2a; }
      .ollie-body { fill: #e8a87c; }
      .ollie-belly { fill: #f0c4a0; }
      .ollie-eye { fill: #ffffff; }
      .ollie-pupil { fill: #3b2a1a; }
      .ollie-beak { fill: #c9a84c; }
      .ollie-wing { fill: none; stroke: #d4956a; stroke-width: 3; stroke-linecap: round; }
      .ollie-foot { fill: #c9a84c; }
    </style>
  </defs>

  <!-- ===== PANEL 1 (Top-Left): Balanced Seesaw ===== -->
  <rect x="4" y="4" width="334" height="284" class="bg" stroke="#e8d5c0" stroke-width="1.5" rx="4"/>
  <text x="16" y="20" class="panel-label">1</text>

  <!-- Ground -->
  <line x1="40" y1="220" x2="300" y2="220" stroke="#e8d5c0" stroke-width="2"/>
  <!-- Fulcrum -->
  <polygon points="170,220 155,180 185,180" fill="#8a6e54" stroke="#3b2a1a" stroke-width="1.5"/>
  <!-- Seesaw plank (balanced) -->
  <line x1="80" y1="180" x2="260" y2="180" stroke="#3b2a1a" stroke-width="3" stroke-linecap="round"/>

  <!-- YIN seat -->
  <rect x="75" y="180" width="20" height="6" fill="#e8a87c" stroke="#3b2a1a" stroke-width="1"/>
  <text x="85" y="170" class="label" font-size="8">YIN</text>
  <circle cx="85" cy="174" r="5" fill="none" stroke="#b83a2a" stroke-width="1.5"/>

  <!-- YANG seat -->
  <rect x="245" y="180" width="20" height="6" fill="#e8a87c" stroke="#3b2a1a" stroke-width="1"/>
  <text x="255" y="170" class="label" font-size="8">YANG</text>
  <circle cx="255" cy="174" r="5" fill="#c9a84c" stroke="#b83a2a" stroke-width="1"/>

  <!-- Ollie (beside seesaw, comic-13 style) -->
  <!-- Shadow -->
  <ellipse cx="310" cy="213" rx="15" ry="4" fill="#d4c4a8" opacity="0.4"/>
  <!-- Body -->
  <ellipse cx="310" cy="200" rx="17" ry="14" class="ollie-body"/>
  <ellipse cx="310" cy="205" rx="12" ry="9" class="ollie-belly"/>
  <!-- Wings -->
  <path d="M296,197 Q286,205 294,215" class="ollie-wing" stroke-width="2"/>
  <path d="M324,197 Q334,205 326,215" class="ollie-wing" stroke-width="2"/>
  <!-- Head -->
  <circle cx="310" cy="183" r="16" class="ollie-head"/>
  <!-- Ear tufts -->
  <ellipse cx="299" cy="169" rx="4" ry="7" class="ollie-head" transform="rotate(-20 299 169)"/>
  <ellipse cx="321" cy="169" rx="4" ry="7" class="ollie-head" transform="rotate(20 321 169)"/>
  <!-- Eyes -->
  <ellipse cx="304" cy="181" rx="5" ry="6" class="ollie-eye"/>
  <ellipse cx="316" cy="181" rx="5" ry="6" class="ollie-eye"/>
  <circle cx="305" cy="183" r="3" class="ollie-pupil"/>
  <circle cx="315" cy="183" r="3" class="ollie-pupil"/>
  <circle cx="306" cy="181" r="1.2" fill="white"/>
  <circle cx="316" cy="181" r="1.2" fill="white"/>
  <!-- Beak (gold!) -->
  <polygon points="310,188 307,184 313,184" class="ollie-beak"/>
  <!-- Feet -->
  <polygon points="304,212 302,218 308,218" class="ollie-foot"/>
  <polygon points="316,212 312,218 318,218" class="ollie-foot"/>
  <!-- Pendant -->
  <circle cx="310" cy="200" r="4" fill="#c9a84c" stroke="#5a4a3a" stroke-width="0.6"/>
  <path d="M310,196 A2,2 0 0,1 310,200 A2,2 0 0,0 310,204 A4,4 0 0,1 310,196" fill="#3b2a1a"/>

  <!-- Speech bubble -->
  <rect x="140" y="85" width="175" height="40" rx="10" class="bubble"/>
  <polygon points="215,125 210,135 220,135" fill="white" stroke="#3b2a1a" stroke-width="1.5"/>
  <text x="227" y="107" class="bubble-text">Meet the oldest seesaw</text>
  <text x="227" y="119" class="bubble-text">in medical history.</text>

  <!-- ===== PANEL 2 (Top-Right): Yang Rises, Yin Falls ===== -->
  <rect x="342" y="4" width="334" height="284" class="bg" stroke="#e8d5c0" stroke-width="1.5" rx="4"/>
  <text x="354" y="20" class="panel-label">2</text>

  <!-- Ground -->
  <line x1="380" y1="220" x2="640" y2="220" stroke="#e8d5c0" stroke-width="2"/>
  <!-- Fulcrum -->
  <polygon points="510,220 495,180 525,180" fill="#8a6e54" stroke="#3b2a1a" stroke-width="1.5"/>
  <!-- Seesaw plank (Yang side DOWN, Yin side UP) -->
  <line x1="420" y1="165" x2="600" y2="195" stroke="#3b2a1a" stroke-width="3" stroke-linecap="round"/>

  <!-- YIN seat (UP) -->
  <rect x="415" y="165" width="20" height="6" fill="#e8a87c" stroke="#3b2a1a" stroke-width="1" transform="rotate(-9, 425, 168)"/>
  <text x="425" y="155" class="label" font-size="8" fill="#b83a2a">YIN ↑</text>
  <!-- YANG seat (DOWN) -->
  <rect x="585" y="195" width="20" height="6" fill="#e8a87c" stroke="#3b2a1a" stroke-width="1"/>
  <text x="595" y="210" class="label" font-size="8" fill="#b83a2a">YANG ↓</text>

  <!-- Ollie on the Yang (down) side -->
  <ellipse cx="595" cy="213" rx="15" ry="4" fill="#d4c4a8" opacity="0.4"/>
  <ellipse cx="595" cy="200" rx="17" ry="14" class="ollie-body"/>
  <ellipse cx="595" cy="205" rx="12" ry="9" class="ollie-belly"/>
  <path d="M581,197 Q571,205 579,215" class="ollie-wing" stroke-width="2"/>
  <path d="M609,197 Q619,205 611,215" class="ollie-wing" stroke-width="2"/>
  <circle cx="595" cy="183" r="16" class="ollie-head"/>
  <ellipse cx="584" cy="169" rx="4" ry="7" class="ollie-head" transform="rotate(-20 584 169)"/>
  <ellipse cx="606" cy="169" rx="4" ry="7" class="ollie-head" transform="rotate(20 606 169)"/>
  <ellipse cx="589" cy="181" rx="5" ry="6" class="ollie-eye"/>
  <ellipse cx="601" cy="181" rx="5" ry="6" class="ollie-eye"/>
  <circle cx="590" cy="183" r="3" class="ollie-pupil"/>
  <circle cx="600" cy="183" r="3" class="ollie-pupil"/>
  <circle cx="591" cy="181" r="1.2" fill="white"/>
  <circle cx="601" cy="181" r="1.2" fill="white"/>
  <polygon points="595,188 592,184 598,184" class="ollie-beak"/>
  <polygon points="589,212 587,218 593,218" class="ollie-foot"/>
  <polygon points="601,212 597,218 603,218" class="ollie-foot"/>
  <circle cx="595" cy="200" r="4" fill="#c9a84c" stroke="#5a4a3a" stroke-width="0.6"/>
  <path d="M595,196 A2,2 0 0,1 595,200 A2,2 0 0,0 595,204 A4,4 0 0,1 595,196" fill="#3b2a1a"/>

  <!-- Warm glow on Yang side -->
  <ellipse cx="610" cy="170" rx="40" ry="30" fill="#c9a84c" opacity="0.12"/>

  <text x="510" y="270" class="caption">Yang rises, Yin falls.</text>

  <!-- ===== PANEL 3 (Bottom-Left): Yin Rises, Yang Falls ===== -->
  <rect x="4" y="292" width="334" height="284" class="bg" stroke="#e8d5c0" stroke-width="1.5" rx="4"/>
  <text x="16" y="308" class="panel-label">3</text>

  <!-- Ground -->
  <line x1="40" y1="508" x2="300" y2="508" stroke="#e8d5c0" stroke-width="2"/>
  <!-- Fulcrum -->
  <polygon points="170,508 155,468 185,468" fill="#8a6e54" stroke="#3b2a1a" stroke-width="1.5"/>
  <!-- Seesaw plank (Yin side DOWN, Yang side UP) -->
  <line x1="80" y1="495" x2="260" y2="465" stroke="#3b2a1a" stroke-width="3" stroke-linecap="round"/>

  <!-- YIN seat (DOWN) -->
  <rect x="75" y="495" width="20" height="6" fill="#e8a87c" stroke="#3b2a1a" stroke-width="1"/>
  <text x="85" y="510" class="label" font-size="8" fill="#b83a2a">YIN ↓</text>
  <circle cx="85" cy="489" r="5" fill="none" stroke="#b83a2a" stroke-width="1.5"/>
  <!-- YANG seat (UP) -->
  <rect x="245" y="465" width="20" height="6" fill="#e8a87c" stroke="#3b2a1a" stroke-width="1" transform="rotate(9, 255, 468)"/>
  <text x="255" y="455" class="label" font-size="8" fill="#b83a2a">YANG ↑</text>

  <!-- Ollie on the Yin (down) side -->
  <ellipse cx="85" cy="501" rx="15" ry="4" fill="#d4c4a8" opacity="0.4"/>
  <ellipse cx="85" cy="488" rx="17" ry="14" class="ollie-body"/>
  <ellipse cx="85" cy="493" rx="12" ry="9" class="ollie-belly"/>
  <path d="M71,485 Q61,493 69,503" class="ollie-wing" stroke-width="2"/>
  <path d="M99,485 Q109,493 101,503" class="ollie-wing" stroke-width="2"/>
  <circle cx="85" cy="471" r="16" class="ollie-head"/>
  <ellipse cx="74" cy="457" rx="4" ry="7" class="ollie-head" transform="rotate(-20 74 457)"/>
  <ellipse cx="96" cy="457" rx="4" ry="7" class="ollie-head" transform="rotate(20 96 457)"/>
  <ellipse cx="79" cy="469" rx="5" ry="6" class="ollie-eye"/>
  <ellipse cx="91" cy="469" rx="5" ry="6" class="ollie-eye"/>
  <circle cx="80" cy="471" r="3" class="ollie-pupil"/>
  <circle cx="90" cy="471" r="3" class="ollie-pupil"/>
  <circle cx="81" cy="469" r="1.2" fill="white"/>
  <circle cx="91" cy="469" r="1.2" fill="white"/>
  <polygon points="85,476 82,472 88,472" class="ollie-beak"/>
  <polygon points="79,500 77,506 83,506" class="ollie-foot"/>
  <polygon points="91,500 87,506 93,506" class="ollie-foot"/>
  <circle cx="85" cy="488" r="4" fill="#c9a84c" stroke="#5a4a3a" stroke-width="0.6"/>
  <path d="M85,484 A2,2 0 0,1 85,488 A2,2 0 0,0 85,492 A4,4 0 0,1 85,484" fill="#3b2a1a"/>

  <!-- Cool glow on Yin side -->
  <ellipse cx="60" cy="460" rx="40" ry="30" fill="#b83a2a" opacity="0.06"/>

  <text x="170" y="558" class="caption">Yin rises, Yang falls.</text>

  <!-- ===== PANEL 4 (Bottom-Right): Dynamic Balance ===== -->
  <rect x="342" y="292" width="334" height="284" class="bg" stroke="#e8d5c0" stroke-width="1.5" rx="4"/>
  <text x="354" y="308" class="panel-label">4</text>

  <!-- Ground -->
  <line x1="380" y1="508" x2="640" y2="508" stroke="#e8d5c0" stroke-width="2"/>
  <!-- Fulcrum -->
  <polygon points="500,508 485,468 515,468" fill="#8a6e54" stroke="#3b2a1a" stroke-width="1.5"/>
  <!-- Seesaw plank (slightly tilted, dynamic) -->
  <line x1="410" y1="482" x2="590" y2="485" stroke="#3b2a1a" stroke-width="3" stroke-linecap="round"/>

  <!-- Motion waves -->
  <path d="M400,470 Q425,460 440,470 Q455,480 470,470" fill="none" stroke="#e8a87c" stroke-width="1.5"/>
  <path d="M530,478 Q550,468 570,478 Q590,488 610,478" fill="none" stroke="#e8a87c" stroke-width="1.5"/>

  <!-- Yin seat -->
  <rect x="405" y="482" width="20" height="6" fill="#e8a87c" stroke="#3b2a1a" stroke-width="1" opacity="0.7"/>
  <text x="415" y="478" class="label" font-size="8" fill="#8a6e54">YIN</text>
  <!-- Yang seat -->
  <rect x="575" y="485" width="20" height="6" fill="#e8a87c" stroke="#3b2a1a" stroke-width="1" opacity="0.7"/>
  <text x="585" y="498" class="label" font-size="8" fill="#8a6e54">YANG</text>

  <!-- Ollie (beside seesaw, pointing) -->
  <ellipse cx="630" cy="501" rx="15" ry="4" fill="#d4c4a8" opacity="0.4"/>
  <ellipse cx="630" cy="488" rx="17" ry="14" class="ollie-body"/>
  <ellipse cx="630" cy="493" rx="12" ry="9" class="ollie-belly"/>
  <path d="M616,485 Q606,493 614,503" class="ollie-wing" stroke-width="2"/>
  <path d="M644,485 Q654,493 646,503" class="ollie-wing" stroke-width="2"/>
  <circle cx="630" cy="471" r="16" class="ollie-head"/>
  <ellipse cx="619" cy="457" rx="4" ry="7" class="ollie-head" transform="rotate(-20 619 457)"/>
  <ellipse cx="641" cy="457" rx="4" ry="7" class="ollie-head" transform="rotate(20 641 457)"/>
  <ellipse cx="624" cy="469" rx="5" ry="6" class="ollie-eye"/>
  <ellipse cx="636" cy="469" rx="5" ry="6" class="ollie-eye"/>
  <circle cx="625" cy="471" r="3" class="ollie-pupil"/>
  <circle cx="635" cy="471" r="3" class="ollie-pupil"/>
  <circle cx="626" cy="469" r="1.2" fill="white"/>
  <circle cx="636" cy="469" r="1.2" fill="white"/>
  <polygon points="630,476 627,472 633,472" class="ollie-beak"/>
  <polygon points="624,500 622,506 628,506" class="ollie-foot"/>
  <polygon points="636,500 632,506 638,506" class="ollie-foot"/>
  <circle cx="630" cy="488" r="4" fill="#c9a84c" stroke="#5a4a3a" stroke-width="0.6"/>
  <path d="M630,484 A2,2 0 0,1 630,488 A2,2 0 0,0 630,492 A4,4 0 0,1 630,484" fill="#3b2a1a"/>

  <!-- Wing pointing at seesaw -->
  <line x1="620" y1="486" x2="600" y2="480" stroke="#d4956a" stroke-width="2" stroke-linecap="round"/>

  <!-- Speech bubble -->
  <rect x="370" y="540" width="240" height="35" rx="10" class="bubble"/>
  <polygon points="460,575 455,568 465,568" fill="white" stroke="#3b2a1a" stroke-width="1.5"/>
  <text x="490" y="559" class="bubble-text">Neither side is winning.</text>
  <text x="490" y="571" class="bubble-text">That is the point.</text>
</svg>
