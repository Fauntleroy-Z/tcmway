<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="300" height="300">
  <!-- TCM Way Ollie — Flat 2D Style (SOP-compliant: no gradients, no shadows, clean outlines) -->
  <!-- Color Palette: #b83a2a (zhu red), #e8a87c (apricot), #fdf6ee (warm white), #c9a84c (gold), #8a6e54 (subtle brown) -->

  <!-- Ear tufts (zhu red, pointed, on top) -->
  <polygon points="88,100 78,58 108,85" fill="#b83a2a" stroke="#b83a2a" stroke-width="1"/>
  <polygon points="212,100 222,58 192,85" fill="#b83a2a" stroke="#b83a2a" stroke-width="1"/>

  <!-- Body (apricot, flat) -->
  <ellipse cx="150" cy="175" rx="90" ry="82" fill="#e8a87c" stroke="#b83a2a" stroke-width="2"/>

  <!-- Wing hints (flat, no opacity tricks) -->
  <path d="M70,140 Q55,180 75,210" fill="none" stroke="#b83a2a" stroke-width="2" stroke-linecap="round"/>
  <path d="M230,140 Q245,180 225,210" fill="none" stroke="#b83a2a" stroke-width="2" stroke-linecap="round"/>

  <!-- Face (lighter flat core) -->
  <ellipse cx="150" cy="148" rx="58" ry="55" fill="#fdf6ee" stroke="#b83a2a" stroke-width="1.5"/>

  <!-- Eyes (large round, zhu red) -->
  <circle cx="130" cy="140" r="16" fill="white" stroke="#b83a2a" stroke-width="2"/>
  <circle cx="170" cy="140" r="16" fill="white" stroke="#b83a2a" stroke-width="2"/>

  <!-- Irises (zhu red, flat) -->
  <circle cx="130" cy="143" r="10" fill="#b83a2a"/>
  <circle cx="170" cy="143" r="10" fill="#b83a2a"/>

  <!-- Pupils -->
  <circle cx="130" cy="145" r="5" fill="#1a1410"/>
  <circle cx="170" cy="145" r="5" fill="#1a1410"/>

  <!-- Eye highlights (flat white dots) -->
  <circle cx="127" cy="139" r="2.5" fill="white"/>
  <circle cx="167" cy="139" r="2.5" fill="white"/>

  <!-- Beak (short triangular, zhu red) -->
  <polygon points="150,152 138,162 162,162" fill="#b83a2a" stroke="#b83a2a" stroke-width="1"/>

  <!-- Yin-Yang Pendant (gold, flat) -->
  <circle cx="150" cy="180" r="12" fill="#c9a84c" stroke="#b83a2a" stroke-width="1.5"/>
  <circle cx="150" cy="180" r="4" fill="#b83a2a"/>
  <path d="M146,180 L154,180" stroke="#b83a2a" stroke-width="0.8"/>
  <!-- Yin-Yang dot -->
  <circle cx="150" cy="177" r="1.5" fill="#c9a84c"/>

  <!-- Feet (small, simple) -->
  <ellipse cx="135" cy="255" rx="10" ry="6" fill="#b83a2a" opacity="0.7"/>
  <ellipse cx="165" cy="255" rx="10" ry="6" fill="#b83a2a" opacity="0.7"/>
</svg>
